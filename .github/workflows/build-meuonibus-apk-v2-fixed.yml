name: Build MeuOnibusSP APK v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android app
        shell: bash
        run: |
          mkdir -p "$(dirname 'MeuOnibusSP.csproj')"
          cat > 'MeuOnibusSP.csproj' <<'EOF_1'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0-android</TargetFramework>
              <OutputType>Exe</OutputType>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <ApplicationId>com.rafael.meuonibussp</ApplicationId>
              <ApplicationTitle>Meu Ônibus SP</ApplicationTitle>
              <ApplicationVersion>2</ApplicationVersion>
              <ApplicationDisplayVersion>0.2.0</ApplicationDisplayVersion>
              <SupportedOSPlatformVersion>23.0</SupportedOSPlatformVersion>
              <AndroidPackageFormat>apk</AndroidPackageFormat>
            </PropertyGroup>
          </Project>
          EOF_1

          mkdir -p "$(dirname 'AndroidManifest.xml')"
          cat > 'AndroidManifest.xml' <<'EOF_2'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <application
                android:allowBackup="true"
                android:label="Meu Ônibus SP"
                android:theme="@android:style/Theme.Material.Light.NoActionBar"
                android:usesCleartextTraffic="true" />
          </manifest>
          EOF_2

          mkdir -p "$(dirname 'MainActivity.cs')"
          cat > 'MainActivity.cs' <<'EOF_3'
          using System.Net;
          using System.Net.Http.Json;
          using System.Text.Json.Serialization;
          using Android;
          using Android.App;
          using Android.Content.PM;
          using Android.Graphics;
          using Android.Locations;
          using Android.OS;
          using Android.Views;
          using Android.Widget;

          namespace MeuOnibusSP;

          [Activity(
              Label = "Meu Ônibus SP",
              MainLauncher = true,
              Exported = true,
              Theme = "@android:style/Theme.Material.Light.NoActionBar")]
          public sealed class MainActivity : Activity, ILocationListener
          {
              const int LocationRequestCode = 1001;

              readonly CookieContainer _cookies = new();
              HttpClient _http = null!;
              LocationManager _locationManager = null!;

              EditText _token = null!;
              EditText _search = null!;
              Button _searchButton = null!;
              TextView _status = null!;
              LinearLayout _results = null!;

              Android.Locations.Location? _currentLocation;
              bool _authenticated;

              protected override void OnCreate(Bundle? savedInstanceState)
              {
                  base.OnCreate(savedInstanceState);

                  var handler = new HttpClientHandler
                  {
                      UseCookies = true,
                      CookieContainer = _cookies
                  };

                  _http = new HttpClient(handler)
                  {
                      BaseAddress = new Uri("http://api.olhovivo.sptrans.com.br/v2.1/"),
                      Timeout = TimeSpan.FromSeconds(20)
                  };

                  BuildUi();
                  RequestLocation();
              }

              void BuildUi()
              {
                  var scroll = new ScrollView(this);
                  var root = new LinearLayout(this)
                  {
                      Orientation = Orientation.Vertical
                  };
                  root.SetPadding(Dp(18), Dp(22), Dp(18), Dp(24));
                  scroll.AddView(root);

                  var title = new TextView(this)
                  {
                      Text = "🚌 Meu Ônibus SP",
                      TextSize = 28
                  };
                  title.SetTextColor(Color.Rgb(17, 24, 39));
                  title.SetTypeface(null, Android.Graphics.TypefaceStyle.Bold);
                  root.AddView(title);

                  var subtitle = new TextView(this)
                  {
                      Text = "Linhas e previsão em tempo real pela SPTrans",
                      TextSize = 14
                  };
                  subtitle.SetTextColor(Color.Rgb(107, 114, 128));
                  subtitle.SetPadding(0, 0, 0, Dp(18));
                  root.AddView(subtitle);

                  _token = new EditText(this)
                  {
                      Hint = "Token da API Olho Vivo",
                      InputType = Android.Text.InputTypes.ClassText
                  };
                  _token.InputType = Android.Text.InputTypes.ClassText |
                                     Android.Text.InputTypes.TextVariationPassword;
                  root.AddView(_token, MatchWrap());

                  _search = new EditText(this)
                  {
                      Hint = "Linha: ex. 875A, 8000",
                      InputType = Android.Text.InputTypes.ClassText
                  };
                  root.AddView(_search, MatchWrap());

                  _searchButton = new Button(this)
                  {
                      Text = "BUSCAR LINHA"
                  };
                  _searchButton.Click += async (_, _) => await SearchAsync();
                  root.AddView(_searchButton, MatchWrap());

                  _status = new TextView(this)
                  {
                      Text = "Obtendo sua localização...",
                      TextSize = 15
                  };
                  _status.SetTextColor(Color.Rgb(75, 85, 99));
                  _status.SetPadding(0, Dp(14), 0, Dp(12));
                  root.AddView(_status);

                  _results = new LinearLayout(this)
                  {
                      Orientation = Orientation.Vertical
                  };
                  root.AddView(_results);

                  SetContentView(scroll);
              }

              async Task SearchAsync()
              {
                  var token = _token.Text?.Trim();
                  var search = _search.Text?.Trim();

                  if (string.IsNullOrWhiteSpace(token))
                  {
                      Toast.MakeText(this, "Informe o token da SPTrans.", ToastLength.Short)?.Show();
                      return;
                  }

                  if (string.IsNullOrWhiteSpace(search))
                  {
                      Toast.MakeText(this, "Informe a linha.", ToastLength.Short)?.Show();
                      return;
                  }

                  try
                  {
                      SetBusy(true, "Consultando SPTrans...");

                      if (!_authenticated)
                      {
                          var response = await _http.PostAsync(
                              $"Login/Autenticar?token={Uri.EscapeDataString(token)}",
                              null);

                          response.EnsureSuccessStatusCode();
                          var ok = await response.Content.ReadFromJsonAsync<bool>();

                          if (!ok)
                              throw new Exception("Token recusado pela SPTrans.");

                          _authenticated = true;
                      }

                      var lines = await _http.GetFromJsonAsync<List<BusLine>>(
                          $"Linha/Buscar?termosBusca={Uri.EscapeDataString(search)}") ?? [];

                      _results.RemoveAllViews();

                      if (lines.Count == 0)
                      {
                          _status.Text = "Nenhuma linha encontrada.";
                          return;
                      }

                      _status.Text = $"{lines.Count} opção(ões). Toque no sentido desejado.";

                      foreach (var line in lines)
                      {
                          var button = new Button(this)
                          {
                              Text = $"{line.DisplayCode}\n{line.DirectionText}",
                              
                          };

                          button.Click += async (_, _) => await SelectLineAsync(line);
                          _results.AddView(button, MatchWrap());
                      }
                  }
                  catch (Exception ex)
                  {
                      _status.Text = $"Erro: {ex.Message}";
                  }
                  finally
                  {
                      SetBusy(false);
                  }
              }

              async Task SelectLineAsync(BusLine line)
              {
                  try
                  {
                      SetBusy(true, "Localizando ponto mais próximo...");

                      if (_currentLocation is null)
                      {
                          _status.Text = "Ainda não consegui obter sua localização. Ative o GPS e tente novamente.";
                          RequestLocation();
                          return;
                      }

                      var stops = await _http.GetFromJsonAsync<List<BusStop>>(
                          $"Parada/BuscarParadasPorLinha?codigoLinha={line.Code}") ?? [];

                      if (stops.Count == 0)
                      {
                          _status.Text = "A SPTrans não retornou paradas para essa linha.";
                          return;
                      }

                      BusStop? nearest = null;
                      var shortest = double.MaxValue;

                      foreach (var stop in stops)
                      {
                          var distance = DistanceMeters(
                              _currentLocation.Latitude,
                              _currentLocation.Longitude,
                              stop.Latitude,
                              stop.Longitude);

                          if (distance < shortest)
                          {
                              shortest = distance;
                              nearest = stop;
                          }
                      }

                      if (nearest is null)
                          return;

                      _status.Text = $"🚏 {nearest.Name}\n{nearest.Address}\n📍 {shortest:N0} m de você\n\nConsultando próximos ônibus...";

                      var arrival = await _http.GetFromJsonAsync<ArrivalResponse>(
                          $"Previsao?codigoParada={nearest.Code}&codigoLinha={line.Code}");

                      var vehicles = arrival?.Stop?.Lines
                          .SelectMany(x => x.Vehicles)
                          .Where(x => !string.IsNullOrWhiteSpace(x.ArrivalTime))
                          .ToList() ?? [];

                      if (vehicles.Count == 0)
                      {
                          _status.Text += "\n\n🚌 Sem previsão disponível agora.";
                          return;
                      }

                      var times = vehicles
                          .Select(v => $"{v.ArrivalTime}")
                          .Take(4);

                      _status.Text += "\n\n🚌 Previsões: " + string.Join(" • ", times);
                  }
                  catch (Exception ex)
                  {
                      _status.Text = $"Erro: {ex.Message}";
                  }
                  finally
                  {
                      SetBusy(false);
                  }
              }

              void RequestLocation()
              {
                  _locationManager = (LocationManager)GetSystemService(LocationService)!;

                  if (Build.VERSION.SdkInt >= BuildVersionCodes.M &&
                      CheckSelfPermission(Manifest.Permission.AccessFineLocation) != Permission.Granted)
                  {
                      RequestPermissions(
                          [Manifest.Permission.AccessFineLocation, Manifest.Permission.AccessCoarseLocation],
                          LocationRequestCode);
                      return;
                  }

                  StartLocationUpdates();
              }

              [Android.Runtime.Register("onRequestPermissionsResult", "(I[Ljava/lang/String;[I)V", "")]
              public override void OnRequestPermissionsResult(
                  int requestCode,
                  string[] permissions,
                  Permission[] grantResults)
              {
                  base.OnRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == LocationRequestCode &&
                      grantResults.Length > 0 &&
                      grantResults[0] == Permission.Granted)
                  {
                      StartLocationUpdates();
                  }
                  else
                  {
                      _status.Text = "Permissão de localização não concedida.";
                  }
              }

              void StartLocationUpdates()
              {
                  try
                  {
                      var provider = _locationManager.IsProviderEnabled(LocationManager.GpsProvider)
                          ? LocationManager.GpsProvider
                          : LocationManager.NetworkProvider;

                      _locationManager.RequestLocationUpdates(provider, 5000, 10, this);
                      _currentLocation = _locationManager.GetLastKnownLocation(provider);

                      _status.Text = _currentLocation is null
                          ? "Aguardando sinal de localização..."
                          : "Localização pronta. Informe o token e a linha.";
                  }
                  catch (Java.Lang.SecurityException)
                  {
                      _status.Text = "Sem permissão para acessar localização.";
                  }
              }

              public void OnLocationChanged(Android.Locations.Location location)
              {
                  _currentLocation = location;
                  if (_status.Text?.Contains("Aguardando") == true)
                      _status.Text = "Localização pronta. Informe o token e a linha.";
              }

              public void OnProviderDisabled(string provider) { }
              public void OnProviderEnabled(string provider) { }
              public void OnStatusChanged(string? provider, Availability status, Bundle? extras) { }

              void SetBusy(bool busy, string? message = null)
              {
                  _searchButton.Enabled = !busy;
                  if (!string.IsNullOrWhiteSpace(message))
                      _status.Text = message;
              }

              LinearLayout.LayoutParams MatchWrap() =>
                  new(ViewGroup.LayoutParams.MatchParent, ViewGroup.LayoutParams.WrapContent);

              int Dp(int value) => (int)(value * Resources!.DisplayMetrics!.Density);

              static double DistanceMeters(double lat1, double lon1, double lat2, double lon2)
              {
                  const double r = 6371000;
                  var p1 = lat1 * Math.PI / 180;
                  var p2 = lat2 * Math.PI / 180;
                  var dp = (lat2 - lat1) * Math.PI / 180;
                  var dl = (lon2 - lon1) * Math.PI / 180;

                  var a = Math.Sin(dp / 2) * Math.Sin(dp / 2) +
                          Math.Cos(p1) * Math.Cos(p2) *
                          Math.Sin(dl / 2) * Math.Sin(dl / 2);

                  return r * 2 * Math.Atan2(Math.Sqrt(a), Math.Sqrt(1 - a));
              }
          }

          public sealed class BusLine
          {
              [JsonPropertyName("cl")] public int Code { get; set; }
              [JsonPropertyName("lc")] public bool IsCircular { get; set; }
              [JsonPropertyName("lt")] public string Sign { get; set; } = "";
              [JsonPropertyName("sl")] public int Direction { get; set; }
              [JsonPropertyName("tl")] public int Type { get; set; }
              [JsonPropertyName("tp")] public string MainTerminal { get; set; } = "";
              [JsonPropertyName("ts")] public string SecondaryTerminal { get; set; } = "";

              public string DisplayCode => $"{Sign}-{Type}";
              public string DirectionText => Direction == 1
                  ? $"{SecondaryTerminal} → {MainTerminal}"
                  : $"{MainTerminal} → {SecondaryTerminal}";
          }

          public sealed class BusStop
          {
              [JsonPropertyName("cp")] public int Code { get; set; }
              [JsonPropertyName("np")] public string Name { get; set; } = "";
              [JsonPropertyName("ed")] public string Address { get; set; } = "";
              [JsonPropertyName("py")] public double Latitude { get; set; }
              [JsonPropertyName("px")] public double Longitude { get; set; }
          }

          public sealed class ArrivalResponse
          {
              [JsonPropertyName("p")] public ArrivalStop? Stop { get; set; }
          }

          public sealed class ArrivalStop
          {
              [JsonPropertyName("l")] public List<ArrivalLine> Lines { get; set; } = [];
          }

          public sealed class ArrivalLine
          {
              [JsonPropertyName("vs")] public List<Vehicle> Vehicles { get; set; } = [];
          }

          public sealed class Vehicle
          {
              [JsonPropertyName("p")] public string Prefix { get; set; } = "";
              [JsonPropertyName("t")] public string? ArrivalTime { get; set; }
          }
          EOF_3


      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: dotnet restore MeuOnibusSP.csproj

      - name: Build APK
        run: dotnet publish MeuOnibusSP.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuOnibusSP-APK-v2
          path: |
            bin/Release/net10.0-android/publish/*.apk
            bin/Release/net10.0-android/*.apk
          if-no-files-found: error
