      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore MeuOnibusSP.csproj

      - name: Publish APK
        run: dotnet publish MeuOnibusSP.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuOnibusSP-APK
          path: |
            bin/Release/net10.0-android/publish/*.apk
            bin/Release/net10.0-android/*.apk
          if-no-files-found: error
