          mkdir -p "$(dirname 'MauiProgram.cs')"
          cat > 'MauiProgram.cs' <<'EOF_FILE_6'
          using MeuOnibusSP.Services;

          namespace MeuOnibusSP;

          public static class MauiProgram
          {
              public static MauiApp CreateMauiApp()
              {
                  var builder = MauiApp.CreateBuilder();

                  builder.UseMauiApp<App>();

                  builder.Services.AddSingleton(new HttpClientHandler
                  {
                      UseCookies = true,
                      CookieContainer = new System.Net.CookieContainer()
                  });

                  builder.Services.AddSingleton(sp =>
                  {
                      var handler = sp.GetRequiredService<HttpClientHandler>();
                      return new HttpClient(handler)
                      {
                          BaseAddress = new Uri("http://api.olhovivo.sptrans.com.br/v2.1/"),
                          Timeout = TimeSpan.FromSeconds(20)
                      };
                  });

                  builder.Services.AddSingleton<SpTransService>();
                  builder.Services.AddSingleton<LocationService>();
                  builder.Services.AddSingleton<DistanceService>();

                  builder.Services.AddSingleton<MainPage>();

                  return builder.Build();
              }
          }
          EOF_FILE_6

          mkdir -p "$(dirname 'Services/DistanceService.cs')"
          cat > 'Services/DistanceService.cs' <<'EOF_FILE_7'
          using MeuOnibusSP.Models;

          namespace MeuOnibusSP.Services;

          public sealed class DistanceService
          {
              public double CalculateMeters(
                  double latitude1,
                  double longitude1,
                  double latitude2,
                  double longitude2)
              {
                  const double earthRadiusMeters = 6371000;

                  var lat1 = DegreesToRadians(latitude1);
                  var lat2 = DegreesToRadians(latitude2);
                  var deltaLat = DegreesToRadians(latitude2 - latitude1);
                  var deltaLon = DegreesToRadians(longitude2 - longitude1);

                  var a =
                      Math.Sin(deltaLat / 2) * Math.Sin(deltaLat / 2) +
                      Math.Cos(lat1) * Math.Cos(lat2) *
                      Math.Sin(deltaLon / 2) * Math.Sin(deltaLon / 2);

                  var c = 2 * Math.Atan2(Math.Sqrt(a), Math.Sqrt(1 - a));

                  return earthRadiusMeters * c;
              }

              public BusStop? FindNearest(
                  IEnumerable<BusStop> stops,
                  Location currentLocation)
              {
                  BusStop? nearest = null;
                  var shortest = double.MaxValue;

                  foreach (var stop in stops)
                  {
                      var distance = CalculateMeters(
                          currentLocation.Latitude,
                          currentLocation.Longitude,
                          stop.Latitude,
                          stop.Longitude);

                      stop.DistanceMeters = distance;

                      if (distance < shortest)
                      {
                          shortest = distance;
                          nearest = stop;
                      }
                  }

                  return nearest;
              }

              private static double DegreesToRadians(double degrees) =>
                  degrees * Math.PI / 180.0;
          }
          EOF_FILE_7

          mkdir -p "$(dirname 'Services/SpTransService.cs')"
          cat > 'Services/SpTransService.cs' <<'EOF_FILE_8'
          using System.Net.Http.Json;
          using System.Text.Json;
          using MeuOnibusSP.Models;

          namespace MeuOnibusSP.Services;

          public sealed class SpTransService
          {
              private readonly HttpClient _httpClient;
              private readonly SemaphoreSlim _authLock = new(1, 1);
              private bool _authenticated;

              public SpTransService(HttpClient httpClient)
              {
                  _httpClient = httpClient;
              }

              public string Token { get; set; } = string.Empty;

              public async Task AuthenticateAsync(CancellationToken cancellationToken = default)
              {
                  if (_authenticated)
                      return;

                  if (string.IsNullOrWhiteSpace(Token))
                      throw new InvalidOperationException(
                          "Configure seu token da SPTrans antes de consultar.");

                  await _authLock.WaitAsync(cancellationToken);

                  try
                  {
                      if (_authenticated)
                          return;

                      var path = $"Login/Autenticar?token={Uri.EscapeDataString(Token)}";

                      using var response = await _httpClient.PostAsync(
                          path,
                          content: null,
                          cancellationToken);

                      response.EnsureSuccessStatusCode();

                      var authenticated = await response.Content
                          .ReadFromJsonAsync<bool>(cancellationToken: cancellationToken);

                      if (!authenticated)
                          throw new InvalidOperationException("A SPTrans recusou o token informado.");

                      _authenticated = true;
                  }
                  finally
                  {
                      _authLock.Release();
                  }
              }

              public async Task<IReadOnlyList<BusLine>> SearchLinesAsync(
                  string search,
                  CancellationToken cancellationToken = default)
              {
                  await AuthenticateAsync(cancellationToken);

                  var url = $"Linha/Buscar?termosBusca={Uri.EscapeDataString(search)}";

                  var result = await _httpClient.GetFromJsonAsync<List<BusLine>>(
                      url,
                      cancellationToken);

                  return result ?? [];
              }

              public async Task<IReadOnlyList<BusStop>> GetStopsByLineAsync(
                  int lineCode,
                  CancellationToken cancellationToken = default)
              {
                  await AuthenticateAsync(cancellationToken);

                  var url = $"Parada/BuscarParadasPorLinha?codigoLinha={lineCode}";

                  var result = await _httpClient.GetFromJsonAsync<List<BusStop>>(
                      url,
                      cancellationToken);

                  return result ?? [];
              }

              public async Task<LinePositionResponse> GetVehiclesAsync(
                  int lineCode,
                  CancellationToken cancellationToken = default)
              {
                  await AuthenticateAsync(cancellationToken);

                  var url = $"Posicao?codigoLinha={lineCode}";

                  return await _httpClient.GetFromJsonAsync<LinePositionResponse>(
                             url,
                             cancellationToken)
                         ?? new LinePositionResponse();
              }

              public async Task<ArrivalResponse> GetArrivalsAsync(
                  int stopCode,
                  int lineCode,
                  CancellationToken cancellationToken = default)
              {
                  await AuthenticateAsync(cancellationToken);

                  var url =
                      $"Previsao?codigoParada={stopCode}&codigoLinha={lineCode}";

                  return await _httpClient.GetFromJsonAsync<ArrivalResponse>(
                             url,
                             cancellationToken)
                         ?? new ArrivalResponse();
              }
          }
          EOF_FILE_8

          mkdir -p "$(dirname 'Services/LocationService.cs')"
          cat > 'Services/LocationService.cs' <<'EOF_FILE_9'
          namespace MeuOnibusSP.Services;

          public sealed class LocationService
          {
              public async Task<Location> GetCurrentLocationAsync(
                  CancellationToken cancellationToken = default)
              {
                  var status = await Permissions.CheckStatusAsync<Permissions.LocationWhenInUse>();

                  if (status != PermissionStatus.Granted)
                      status = await Permissions.RequestAsync<Permissions.LocationWhenInUse>();

                  if (status != PermissionStatus.Granted)
                      throw new InvalidOperationException("Permissão de localização não concedida.");

                  var request = new GeolocationRequest(
                      GeolocationAccuracy.High,
                      TimeSpan.FromSeconds(10));

                  var location = await Geolocation.Default.GetLocationAsync(
                      request,
                      cancellationToken);

                  return location ??
                         throw new InvalidOperationException("Não foi possível obter sua localização.");
              }
          }
          EOF_FILE_9

