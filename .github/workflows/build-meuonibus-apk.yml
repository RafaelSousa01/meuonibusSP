          mkdir -p "$(dirname 'Models/BusLine.cs')"
          cat > 'Models/BusLine.cs' <<'EOF_FILE_14'
          using System.Text.Json.Serialization;

          namespace MeuOnibusSP.Models;

          public sealed class BusLine
          {
              [JsonPropertyName("cl")]
              public int Code { get; set; }

              [JsonPropertyName("lc")]
              public bool IsCircular { get; set; }

              [JsonPropertyName("lt")]
              public string Sign { get; set; } = string.Empty;

              [JsonPropertyName("sl")]
              public int Direction { get; set; }

              [JsonPropertyName("tl")]
              public int Type { get; set; }

              [JsonPropertyName("tp")]
              public string MainTerminal { get; set; } = string.Empty;

              [JsonPropertyName("ts")]
              public string SecondaryTerminal { get; set; } = string.Empty;

              [JsonIgnore]
              public string DisplayCode => $"{Sign}-{Type}";

              [JsonIgnore]
              public string DirectionText =>
                  Direction == 1
                      ? $"{SecondaryTerminal} → {MainTerminal}"
                      : $"{MainTerminal} → {SecondaryTerminal}";

              public override string ToString() => $"{DisplayCode} • {DirectionText}";
          }
          EOF_FILE_14

          mkdir -p "$(dirname 'Resources/Raw/map.html')"
          cat > 'Resources/Raw/map.html' <<'EOF_FILE_15'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8" />
              <meta
                  name="viewport"
                  content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

              <link
                  rel="stylesheet"
                  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

              <style>
                  html, body, #map {
                      height: 100%;
                      margin: 0;
                      padding: 0;
                  }

                  .bus-marker {
                      background: #1565C0;
                      border: 2px solid white;
                      border-radius: 50%;
                      width: 28px;
                      height: 28px;
                      line-height: 24px;
                      text-align: center;
                      box-shadow: 0 1px 5px rgba(0,0,0,.35);
                  }
              </style>
          </head>
          <body>
          <div id="map"></div>

          <script
              src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
          </script>

          <script>
              const map = L.map('map').setView([-23.5505, -46.6333], 13);

              L.tileLayer(
                  'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                  {
                      maxZoom: 19,
                      attribution: '&copy; OpenStreetMap contributors'
                  }
              ).addTo(map);

              const layers = L.layerGroup().addTo(map);

              function renderBusMap(data) {
                  layers.clearLayers();

                  const bounds = [];

                  const user = L.marker(
                      [data.user.lat, data.user.lon],
                      { title: 'Você' }
                  )
                  .bindPopup('Você está aqui')
                  .addTo(layers);

                  bounds.push([data.user.lat, data.user.lon]);

                  const stop = L.marker(
                      [data.stop.lat, data.stop.lon],
                      { title: data.stop.name }
                  )
                  .bindPopup('🚏 ' + data.stop.name)
                  .addTo(layers);

                  bounds.push([data.stop.lat, data.stop.lon]);

                  data.vehicles.forEach(v => {
                      const icon = L.divIcon({
                          html: '🚌',
                          className: 'bus-marker',
                          iconSize: [28, 28]
                      });

                      L.marker(
                          [v.lat, v.lon],
                          { icon: icon }
                      )
                      .bindPopup('Ônibus ' + v.prefix)
                      .addTo(layers);

                      bounds.push([v.lat, v.lon]);
                  });

                  if (bounds.length > 1) {
                      map.fitBounds(bounds, { padding: [30, 30] });
                  } else {
                      map.setView([data.user.lat, data.user.lon], 15);
                  }

                  setTimeout(() => map.invalidateSize(), 200);
              }
          </script>
          </body>
          </html>
