name: Build MeuOnibusSP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create app source
        shell: bash
        run: |
          mkdir -p "$(dirname 'App.xaml')"
          cat > 'App.xaml' <<'EOF_FILE_1'
          <?xml version="1.0" encoding="UTF-8" ?>
          <Application
              x:Class="MeuOnibusSP.App"
              xmlns="http://schemas.microsoft.com/dotnet/2021/maui"
              xmlns:x="http://schemas.microsoft.com/winfx/2009/xaml">
              <Application.Resources>
                  <ResourceDictionary>
                      <Color x:Key="Primary">#1565C0</Color>
                      <Color x:Key="Surface">#FFFFFF</Color>
                      <Color x:Key="Background">#F4F6F8</Color>
                      <Color x:Key="TextPrimary">#111827</Color>
                      <Color x:Key="TextSecondary">#6B7280</Color>
                  </ResourceDictionary>
              </Application.Resources>
          </Application>
          EOF_FILE_1

          mkdir -p "$(dirname 'MeuOnibusSP.csproj')"
          cat > 'MeuOnibusSP.csproj' <<'EOF_FILE_2'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFrameworks>net10.0-android</TargetFrameworks>
              <OutputType>Exe</OutputType>
              <RootNamespace>MeuOnibusSP</RootNamespace>
              <UseMaui>true</UseMaui>
              <SingleProject>true</SingleProject>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>

              <ApplicationTitle>Meu Ônibus SP</ApplicationTitle>
              <ApplicationId>com.rafael.meuonibussp</ApplicationId>
              <ApplicationDisplayVersion>0.1.0</ApplicationDisplayVersion>
              <ApplicationVersion>1</ApplicationVersion>
              <SupportedOSPlatformVersion>23.0</SupportedOSPlatformVersion>
            </PropertyGroup>
          </Project>
          EOF_FILE_2

          mkdir -p "$(dirname 'MainPage.xaml.cs')"
          cat > 'MainPage.xaml.cs' <<'EOF_FILE_3'
          using System.Globalization;
          using System.Text.Json;
          using MeuOnibusSP.Models;
          using MeuOnibusSP.Services;

          namespace MeuOnibusSP;

          public partial class MainPage : ContentPage
          {
              private readonly SpTransService _spTrans;
              private readonly LocationService _locationService;
              private readonly DistanceService _distanceService;

              private Location? _currentLocation;
              private BusLine? _selectedLine;
              private BusStop? _nearestStop;

              public MainPage(
                  SpTransService spTrans,
                  LocationService locationService,
                  DistanceService distanceService)
              {
                  InitializeComponent();

                  _spTrans = spTrans;
                  _locationService = locationService;
                  _distanceService = distanceService;
              }

              private async void OnSearchClicked(object? sender, EventArgs e)
              {
                  var search = SearchEntry.Text?.Trim();

                  if (string.IsNullOrWhiteSpace(search))
                  {
                      await DisplayAlert("Busca", "Digite o número ou nome da linha.", "OK");
                      return;
                  }

                  _spTrans.Token = TokenEntry.Text?.Trim() ?? string.Empty;

                  await RunBusyAsync(async () =>
                  {
                      StatusLabel.Text = "Obtendo sua localização...";
                      _currentLocation ??= await _locationService.GetCurrentLocationAsync();

                      StatusLabel.Text = "Buscando linhas na SPTrans...";
                      var lines = await _spTrans.SearchLinesAsync(search);

                      LinesCollection.ItemsSource = lines;

                      StatusLabel.Text = lines.Count == 0
                          ? "Nenhuma linha encontrada."
                          : $"Encontradas {lines.Count} opções. Escolha o sentido.";
                  });
              }

              private async void OnLineSelected(
                  object? sender,
                  SelectionChangedEventArgs e)
              {
                  _selectedLine = e.CurrentSelection
                      .OfType<BusLine>()
                      .FirstOrDefault();

                  if (_selectedLine is null)
                      return;

                  await RunBusyAsync(async () =>
                  {
                      _currentLocation ??= await _locationService.GetCurrentLocationAsync();

                      StatusLabel.Text = "Localizando o ponto mais próximo dessa linha...";

                      var stops = await _spTrans.GetStopsByLineAsync(_selectedLine.Code);

                      _nearestStop = _distanceService.FindNearest(
                          stops,
                          _currentLocation);

                      if (_nearestStop is null)
                      {
                          StatusLabel.Text = "Não encontrei paradas para essa linha.";
                          return;
                      }

                      StopNameLabel.Text = _nearestStop.Name;
                      StopAddressLabel.Text = _nearestStop.Address;
                      DistanceLabel.Text = $"{_nearestStop.DistanceMeters:N0} m de você";
                      NearestStopCard.IsVisible = true;

                      StatusLabel.Text = "Consultando previsão e posições dos ônibus...";

                      var arrivalsTask = _spTrans.GetArrivalsAsync(
                          _nearestStop.Code,
                          _selectedLine.Code);

                      var vehiclesTask = _spTrans.GetVehiclesAsync(
                          _selectedLine.Code);

                      await Task.WhenAll(arrivalsTask, vehiclesTask);

                      var arrivals = await arrivalsTask;
                      var positions = await vehiclesTask;

                      RenderArrivals(arrivals);
                      await RenderMapAsync(positions.Vehicles);

                      StatusLabel.Text =
                          $"Linha {_selectedLine.DisplayCode} atualizada às {positions.ReferenceTime}.";
                  });
              }

              private void RenderArrivals(ArrivalResponse response)
              {
                  var vehicles = response.Stop?
                      .Lines
                      .SelectMany(line => line.Vehicles)
                      .Where(vehicle => !string.IsNullOrWhiteSpace(vehicle.ArrivalTime))
                      .OrderBy(vehicle => vehicle.ArrivalTime)
                      .ToList() ?? [];

                  ArrivalsLabel.Text = vehicles.Count == 0
                      ? "Sem previsão"
                      : string.Join(" • ", vehicles.Take(3).Select(v => v.ArrivalTime));

                  VehicleCountLabel.Text =
                      vehicles.Count == 0
                          ? "A SPTrans não retornou previsão para este ponto agora."
                          : $"{vehicles.Count} veículo(s) com previsão para o ponto.";

                  ArrivalsCard.IsVisible = true;
              }

              private async Task RenderMapAsync(IReadOnlyList<Vehicle> vehicles)
              {
                  if (_currentLocation is null || _nearestStop is null)
                      return;

                  var mapFile = await FileSystem.OpenAppPackageFileAsync("map.html");
                  using var reader = new StreamReader(mapFile);
                  var html = await reader.ReadToEndAsync();

                  MapWebView.Source = new HtmlWebViewSource
                  {
                      Html = html
                  };

                  MapCard.IsVisible = true;

                  await Task.Delay(700);

                  var payload = new
                  {
                      user = new
                      {
                          lat = _currentLocation.Latitude,
                          lon = _currentLocation.Longitude
                      },
                      stop = new
                      {
                          lat = _nearestStop.Latitude,
                          lon = _nearestStop.Longitude,
                          name = _nearestStop.Name
                      },
                      vehicles = vehicles.Select(v => new
                      {
                          lat = v.Latitude,
                          lon = v.Longitude,
                          prefix = v.Prefix
                      })
                  };

                  var json = JsonSerializer.Serialize(payload);

                  await MapWebView.EvaluateJavaScriptAsync(
                      $"renderBusMap({json});");
              }

              private async Task RunBusyAsync(Func<Task> action)
              {
                  try
                  {
                      LoadingIndicator.IsVisible = true;
                      LoadingIndicator.IsRunning = true;

                      await action();
                  }
                  catch (Exception ex)
                  {
                      StatusLabel.Text = "Ocorreu um erro.";
                      await DisplayAlert("Erro", ex.Message, "OK");
                  }
                  finally
                  {
                      LoadingIndicator.IsRunning = false;
                      LoadingIndicator.IsVisible = false;
                  }
              }
          }
          EOF_FILE_3

          mkdir -p "$(dirname 'MainPage.xaml')"
          cat > 'MainPage.xaml' <<'EOF_FILE_4'
